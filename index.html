<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05040a">
  <title>Sorting Hat Engine 3.0.2</title>
  <link rel="stylesheet" href="styles.css?v=30200">
  <script type="importmap">
  {
    "imports": {
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.19.0/dist/pixi.min.mjs"
    }
  }
  </script>
</head>
<body>
  <div id="app" aria-label="The Gender Sorting Ceremony"></div>

  <section id="start-screen" class="start-screen">
    <div class="start-candles" aria-hidden="true">
      <span style="--i:0"></span><span style="--i:1"></span><span style="--i:2"></span><span style="--i:3"></span>
    </div>
    <div class="start-card">
      <div class="crest">✦</div>
      <h1>The Gender Sorting Ceremony</h1>
      <p>The magic has been cast…<br>Now the Sorting Hat shall reveal the greatest mystery of all.</p>
      <button id="start-button" type="button">Begin the Ceremony</button>
      <p id="status" class="status">Loading the ancient magic…</p>
    </div>
  </section>

  <div id="living-vignette" class="living-vignette" aria-hidden="true"></div>
  <div id="firelight-flash" class="firelight-flash" aria-hidden="true"></div>
  <div id="orientation-gate" class="orientation-gate" hidden><div><span>↻</span><strong>Draai je telefoon</strong><p>Deze magische ervaring werkt het best in landscape.</p></div></div>

  <div id="subtitle" class="subtitle" aria-live="polite"></div>
  <div id="prediction" class="prediction" hidden>
    <div class="prediction-title"><strong>WHAT DO YOU THINK?</strong><span>Choose your prediction</span></div>
    <div id="choice-confirmation" class="choice-confirmation" hidden><span>You chose:</span><strong></strong></div>
    <button data-choice="girl"><img src="assets/witch.webp" alt=""><span>A GIRL?</span></button>
    <button data-choice="boy"><img src="assets/wizard.webp" alt=""><span>A BOY?</span></button>
  </div>

  <button id="end-ceremony" class="end-ceremony" type="button" hidden>End ceremony</button>

  <script>
    window.addEventListener('error', function (event) {
      const status = document.getElementById('status');
      if (status) status.textContent = 'Startup error: ' + (event.message || 'unknown error');
      console.error(event.error || event.message);
    });
    window.addEventListener('unhandledrejection', function (event) {
      const status = document.getElementById('status');
      if (status) status.textContent = 'Startup error: ' + (event.reason?.message || event.reason || 'unknown promise error');
      console.error(event.reason);
    });
  </script>
  <script type="module" src="src/main.js?v=30200"></script>
</body>
</html>
